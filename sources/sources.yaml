- "id": "S52"
  "title": "METR time horizons: Kwa et al. paper, Time Horizon 1.1, tracker, and The Decoder on Claude Mythos"
  "author": "Kwa et al."
  "publisher": "METR"
  "published": "18 Mar 2025 (v4 10 Jul 2026)"
  "url": "https://arxiv.org/abs/2503.14499"
  "also":
  - "https://metr.org/blog/2026-01-29-time-horizon-1-1/"
  - "https://metr.org/time-horizons/"
  - "https://the-decoder.com/metr-says-it-can-barely-measure-claude-mythos-palo-alto-networks-warns-of-autonomous-ai-attackers/"
  - "https://x.com/METR_Evals/status/2052896623852929510"
  "accessed": 2026-11-08
  "kind": "paper"
  "read": "read"
  "note": "Kwa et al. (arXiv 2503.14499): Claude 3.7 Sonnet 50% horizon about 50 minutes; doubling about every seven months\
    \ since 2019; \"within 5 years, AI systems will be capable of automating many software tasks that currently take humans\
    \ a month\", conditional on the results generalising. Time Horizon 1.1 (29 Jan 2026): doubling every 89 to 131 days in\
    \ post-2023 windows, so the video says \"three to seven months\". Tracker: \"Measurements above 16 hrs are unreliable\
    \ with our current task suite\". The Decoder (10 May 2026), Claude Mythos Preview tested March 2026: \"at least 16 hours\"\
    , 95% interval 8.5 to 55 hours; METR's own post is an X link that was not opened. The early 2027 to early 2028 range is\
    \ the video's own arithmetic: 170 / 16 hours is 3.4 doublings, at 3 to 7 months each from March 2026."
